<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOE Day 3 實驗設計工坊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#f3f5fa; --panel:#ffffff; --ink:#0d1a3d; --ink2:#4a5677; --line:#d5dbea;
  --navy:#0b2a6f; --blue:#2f6fd6; --blueSoft:#dce7fb; --red:#c8102e; --redSoft:#fbe0e4;
  --ok:#1a8a55; --warn:#c77700; --grid:#e6eaf3;
  --sans:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark; --ground:#0b1224; --panel:#131d36; --ink:#e8edf8; --ink2:#a4b0cc; --line:#2a3757;
  --navy:#9dbbff; --blue:#6c9cff; --blueSoft:#1d2f57; --red:#ff5a6e; --redSoft:#3a1a24; --ok:#45c586; --warn:#f0a93a; --grid:#1c2744;}}
:root[data-theme="dark"]{
  color-scheme:dark; --ground:#0b1224; --panel:#131d36; --ink:#e8edf8; --ink2:#a4b0cc; --line:#2a3757;
  --navy:#9dbbff; --blue:#6c9cff; --blueSoft:#1d2f57; --red:#ff5a6e; --redSoft:#3a1a24; --ok:#45c586; --warn:#f0a93a; --grid:#1c2744;}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px 40px}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand small{display:block;font-size:13px;letter-spacing:.14em;color:var(--red);font-weight:700}
h1{font-size:clamp(24px,3.4vw,38px);font-weight:900;margin:0;line-height:1.15;text-wrap:balance}
h1 span{color:var(--blue)}
.lede{color:var(--ink2);margin:0;max-width:52ch;font-size:15px}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;border-bottom:2px solid var(--line)}
nav button{flex:0 0 auto;font:inherit;font-size:15px;font-weight:700;color:var(--ink2);background:none;border:0;border-bottom:4px solid transparent;padding:8px 12px;cursor:pointer;margin-bottom:-8px}
nav button[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--red)}
nav button:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}
@media (max-width:820px){.stage{grid-template-columns:1fr}}
.viz{min-width:0}
.viz svg{width:100%;height:auto;display:block}
.side{display:flex;flex-direction:column;gap:14px}
.side h2{font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--red);background:var(--redSoft);border-radius:4px;padding:2px 8px}
.say{margin:0;color:var(--ink2);font-size:15px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{display:flex;justify-content:space-between;font-weight:700;font-size:14px}
.ctl output{font-family:var(--mono);color:var(--blue)}
input[type=range]{width:100%;accent-color:var(--blue)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:9px 14px;cursor:pointer;border:2px solid var(--navy);background:var(--navy);color:var(--panel)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.alert{background:var(--red);border-color:var(--red);color:#fff}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-family:var(--mono);font-size:22px;color:var(--navy);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink2)}
.stat.bad b{color:var(--red)} .stat.good b{color:var(--ok)}
.key{margin:0;padding:10px 12px;border-left:4px solid var(--red);background:var(--redSoft);border-radius:0 8px 8px 0;font-weight:700;font-size:15px}
.toggles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.toggles label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:700;font-size:14px}
.toggles input{width:18px;height:18px;accent-color:var(--red)}
svg text{font-family:var(--sans)}
.foot{margin-top:14px;color:var(--ink2);font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.embed header,.embed nav,.embed .foot{display:none}
.embed body,body.embed{padding-block:8px}
.embed .stage{border:0;border-radius:0;padding:12px}
</style>

<div class="wrap">
<header>
  <div class="brand"><small>DOE 實驗設計實戰營 · DAY 3</small><h1>DOE 入門：<span>同時動多個旋鈕</span></h1></div>
  <p class="lede">上課投影用的互動教具。每一頁對應講義的一個單元：先讓學員猜，再按按鈕、拉滑桿，讓數據自己說話。</p>
</header>
<nav role="tablist" id="tabs"></nav>
<section class="stage" id="stage"></section>
<p class="foot">資料為課堂模擬值。建議投影時用瀏覽器全螢幕（F11）。</p>
</div>

<script>
(()=>{
const $=s=>document.querySelector(s);
/* embed-mode: inside PowerPoint Web Viewer or any iframe, hide header/tabs */
try{if(window.self!==window.top||/embed/.test(location.hash)){document.documentElement.classList.add('embed');document.body.classList.add('embed')}}catch(e){document.body.classList.add('embed')}
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const rn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const mean=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const f=(x,d=2)=>Number.isFinite(x)?x.toFixed(d):'—';
const Phi=z=>{const t=1/(1+0.2316419*Math.abs(z)),d=0.3989423*Math.exp(-z*z/2);let p=d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
const NS='http://www.w3.org/2000/svg';
function el(tag,attr={},parent){const e=document.createElementNS(NS,tag);for(const k in attr)e.setAttribute(k,attr[k]);if(parent)parent.appendChild(e);return e}
function txt(p,x,y,s,o={}){const t=el('text',Object.assign({x,y,fill:css('--ink2'),'font-size':14},o),p);t.textContent=s;return t}
function svg(w,h){const s=el('svg',{viewBox:`0 0 ${w} ${h}`,role:'img'});return s}
function axis(s,x0,y0,x1,y1,ticks,sx,lab){el('line',{x1:x0,y1:y0,x2:x1,y2:y0,stroke:css('--ink2'),'stroke-width':1.5},s);ticks.forEach(t=>{const x=sx(t);el('line',{x1:x,y1:y0,x2:x,y2:y0+6,stroke:css('--ink2')},s);txt(s,x,y0+22,String(t),{'text-anchor':'middle','font-family':css('--mono')})});if(lab)txt(s,(x0+x1)/2,y0+44,lab,{'text-anchor':'middle','font-weight':700,fill:css('--ink')})}

const tcrit=df=>({1:12.71,2:4.30,3:3.18,4:2.78,5:2.57,6:2.45,7:2.36,8:2.31,9:2.26,10:2.23,12:2.18,16:2.12,24:2.06})[df]||2.1;
const surf=(a,b)=>{const u=(a-6.5),v=(b-7);return 40+22*Math.exp(-((u+v*0.9)**2)/6-((u-v)**2)/60)+2*(a/10)};
function heat(s,x0,y0,w,h,fn,lo,hi){const N=40;for(let i=0;i<N;i++)for(let j=0;j<N;j++){const a=(i+.5)/N*10,b=(j+.5)/N*10,v=(fn(a,b)-lo)/(hi-lo);const c=`hsl(${220-200*Math.max(0,Math.min(1,v))},70%,${88-40*v}%)`;el('rect',{x:x0+i*w/N,y:y0+h-(j+1)*h/N,width:w/N+.5,height:h/N+.5,fill:c},s)}}
function frame(s,x0,y0,w,h,la,lb){el('rect',{x:x0,y:y0,width:w,height:h,fill:'none',stroke:css('--ink2')},s);for(let k=0;k<=10;k+=2){txt(s,x0+k/10*w,y0+h+18,String(k),{'text-anchor':'middle','font-family':css('--mono'),'font-size':12});txt(s,x0-8,y0+h-k/10*h+4,String(k),{'text-anchor':'end','font-family':css('--mono'),'font-size':12})}txt(s,x0+w/2,y0+h+38,la,{'text-anchor':'middle','font-weight':700,fill:css('--ink')});const t=txt(s,x0-34,y0+h/2,lb,{'text-anchor':'middle','font-weight':700,fill:css('--ink')});t.setAttribute('transform',`rotate(-90 ${x0-34} ${y0+h/2})`)}
const LESSONS=[
{id:'blackbox',tab:'暖身｜黑箱機器',tag:'暖身 · 找最佳參數',title:'只有 10 次機會，你找得到最高點嗎？',
 say:'這台黑箱機器有兩顆旋鈕 A、B（0～10）。點方格上的位置＝試一組參數，會顯示 Y 值（越高越好）。10 次用完再按「揭曉」。',
 key:'靠「一次調一個」很難找到斜斜的山脊。DOE 用有系統的組合，才看得到全貌。',
 init(v,side){const W=560,H=470,s=svg(W,H);v.appendChild(s);let tries=[],reveal=false;const x0=70,y0=20,w=460,h=400;
  side.querySelector('.ctlbox').innerHTML=`<div class="btns"><button class="btn" id="bbr">揭曉真相</button><button class="btn ghost" id="bb0">重來</button></div><div class="stats"><div class="stat"><b id="bbn">10</b><span>剩餘次數</span></div><div class="stat"><b id="bbb">—</b><span>目前找到的最高 Y</span></div><div class="stat"><b>${f(62.6,1)}</b><span>真正的最高 Y</span></div><div class="stat"><b id="bbg">—</b><span>你的達成率</span></div></div>`;
  function draw(){s.innerHTML='';if(reveal)heat(s,x0,y0,w,h,surf,40,64);else el('rect',{x:x0,y:y0,width:w,height:h,fill:css('--blueSoft')},s);
   for(let k=1;k<10;k++){el('line',{x1:x0+k*w/10,y1:y0,x2:x0+k*w/10,y2:y0+h,stroke:css('--panel'),opacity:.6},s);el('line',{x1:x0,y1:y0+k*h/10,x2:x0+w,y2:y0+k*h/10,stroke:css('--panel'),opacity:.6},s)}
   frame(s,x0,y0,w,h,'旋鈕 A','旋鈕 B');
   tries.forEach((t,i)=>{const cx=x0+t[0]/10*w,cy=y0+h-t[1]/10*h;el('circle',{cx,cy,r:14,fill:css('--navy'),stroke:'#fff','stroke-width':2},s);txt(s,cx,cy+5,f(t[2],0),{'text-anchor':'middle',fill:'#fff','font-weight':700,'font-size':12})});
   if(reveal){el('circle',{cx:x0+6.9/10*w,cy:y0+h-6.6/10*h,r:18,fill:'none',stroke:css('--red'),'stroke-width':4},s);txt(s,x0+6.9/10*w+22,y0+h-6.6/10*h-18,'真正最高點',{fill:css('--red'),'font-weight':900})}
   const best=tries.length?Math.max(...tries.map(t=>t[2])):null;$('#bbn').textContent=10-tries.length;$('#bbb').textContent=best?f(best,1):'—';$('#bbg').textContent=best?f(best/62.6*100,0)+'%':'—'}
  s.addEventListener('click',e=>{if(tries.length>=10)return;const r=s.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W,py=(e.clientY-r.top)/r.height*H;const a=(px-x0)/w*10,b=(y0+h-py)/h*10;if(a<0||a>10||b<0||b>10)return;const A=Math.round(a*2)/2,B=Math.round(b*2)/2;tries.push([A,B,surf(A,B)+rn()*0.5]);draw()});
  s.style.cursor='crosshair';$('#bbr').onclick=()=>{reveal=true;draw()};$('#bb0').onclick=()=>{tries=[];reveal=false;draw()};
  [[3,5],[5,5],[7,5]].forEach(([a,b])=>tries.push([a,b,surf(a,b)]));draw();}},
{id:'ofat',tab:'一｜OFAT 陷阱',tag:'單元一 · OFAT vs DOE',title:'一次改一個 vs 同時改多個，誰先爬上山頂？',
 say:'地形圖是真正的 Y（越紅越高）。OFAT：先固定 B 調 A，再固定 A 調 B。DOE：四角＋中心點一次看全貌，再往高處移動。比較兩者的次數與結果。',
 key:'OFAT 沿著十字線走，爬不上斜斜的山頂；還看不到交互作用。',
 init(v,side){const W=560,H=470,s=svg(W,H);v.appendChild(s);const x0=70,y0=20,w=460,h=400;
  side.querySelector('.ctlbox').innerHTML=`<div class="toggles"><label><input type="checkbox" id="of1" checked>顯示 OFAT 路徑</label><label><input type="checkbox" id="of2" checked>顯示 DOE 設計點</label></div><div class="ctl"><label for="ofb">OFAT 起始的 B 值 <output id="oofb"></output></label><input type="range" id="ofb" min="1" max="9" step="0.5" value="3"></div><div class="stats"><div class="stat"><b id="ofr">—</b><span>OFAT 最佳 Y（10 次）</span></div><div class="stat"><b id="dor">—</b><span>DOE 最佳 Y（9 次）</span></div></div>`;
  function draw(){s.innerHTML='';heat(s,x0,y0,w,h,surf,40,64);frame(s,x0,y0,w,h,'旋鈕 A','旋鈕 B');const P=(a,b)=>[x0+a/10*w,y0+h-b/10*h];const b0=+$('#ofb').value;$('#oofb').textContent=b0;
   let ofBest=0;if($('#of1').checked){const As=[1,3,5,7,9];let bestA=1,by=-1;As.forEach(a=>{const y=surf(a,b0);if(y>by){by=y;bestA=a}});const Bs=[1,3,5,7,9];let bestB=b0,bb=-1;Bs.forEach(b=>{const y=surf(bestA,b);if(y>bb){bb=y;bestB=b}});ofBest=Math.max(by,bb);
    const pts=[...As.map(a=>[a,b0]),...Bs.map(b=>[bestA,b])];el('polyline',{points:As.map(a=>P(a,b0).join(',')).join(' '),fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 4'},s);el('polyline',{points:Bs.map(b=>P(bestA,b).join(',')).join(' '),fill:'none',stroke:'#fff','stroke-width':3,'stroke-dasharray':'6 4'},s);
    pts.forEach(([a,b])=>{const [cx,cy]=P(a,b);el('circle',{cx,cy,r:7,fill:'#fff',stroke:css('--ink'),'stroke-width':2},s)});const [cx,cy]=P(bestA,bestB);txt(s,cx+10,cy-10,'OFAT 停在這',{fill:'#fff','font-weight':900,stroke:'#000','stroke-width':.4})}
   let doBest=0;if($('#of2').checked){const d1=[[3,3],[3,9],[9,3],[9,9],[6,6]],d2=[[6,6],[6,8],[8,6],[8,8],[7,7]];[...d1,...d2].forEach(([a,b],i)=>{const [cx,cy]=P(a,b);el('rect',{x:cx-8,y:cy-8,width:16,height:16,fill:i<5?css('--navy'):css('--red'),stroke:'#fff','stroke-width':2},s);doBest=Math.max(doBest,surf(a,b))});const [cx,cy]=P(7,7);txt(s,cx+12,cy+26,'DOE 第二輪',{fill:'#fff','font-weight':900,stroke:'#000','stroke-width':.4})}
   $('#ofr').textContent=ofBest?f(ofBest,1):'—';$('#dor').textContent=doBest?f(doBest,1):'—'}
  ['#of1','#of2'].forEach(k=>$(k).onchange=draw);$('#ofb').oninput=draw;draw();}},
{id:'interaction',tab:'三｜交互作用',tag:'單元三 · 主效果與交互作用',title:'兩條線不平行，就是交互作用',
 say:'熱處理：溫度 × 時間 → 硬度。拉「交互作用」滑桿，看交互作用圖的兩條線從平行→張開→交叉。左邊是兩個因子各自的主效果圖。',
 key:'交互作用：一顆旋鈕的效果，要看另一顆轉在哪。線不平行＝有交互作用；交叉＝最佳設定會翻轉。',
 init(v,side){const W=720,H=380,s=svg(W,H);v.appendChild(s);
  side.querySelector('.ctlbox').innerHTML=`<div class="ctl"><label for="iA">溫度 主效果 <output id="oiA"></output></label><input type="range" id="iA" min="-6" max="6" step="0.5" value="3"></div><div class="ctl"><label for="iB">時間 主效果 <output id="oiB"></output></label><input type="range" id="iB" min="-6" max="6" step="0.5" value="2"></div><div class="ctl"><label for="iI">交互作用 溫度×時間 <output id="oiI"></output></label><input type="range" id="iI" min="-6" max="6" step="0.5" value="0"></div><div class="stats"><div class="stat" id="ist"><b id="iS">—</b><span>兩條線的關係</span></div><div class="stat"><b id="iBest">—</b><span>最佳組合</span></div></div>`;
  function draw(){s.innerHTML='';const A=+$('#iA').value,B=+$('#iB').value,I=+$('#iI').value;$('#oiA').textContent=A;$('#oiB').textContent=B;$('#oiI').textContent=I;
   const y=(a,b)=>50+A/2*a+B/2*b+I/2*a*b;const lo=38,hi=62;
   const panel=(x0,w,title,pts,cols,labels)=>{const y0=40,h=250,sy=v=>y0+h-(v-lo)/(hi-lo)*h;el('rect',{x:x0,y:y0,width:w,height:h,fill:'none',stroke:css('--line')},s);txt(s,x0+w/2,y0-14,title,{'text-anchor':'middle','font-weight':900,fill:css('--ink')});
     for(let v=40;v<=60;v+=10){txt(s,x0-6,sy(v)+4,String(v),{'text-anchor':'end','font-family':css('--mono'),'font-size':12})}
     pts.forEach((p,i)=>{el('polyline',{points:p.map((v,j)=>(x0+30+j*(w-60))+','+sy(v)).join(' '),fill:'none',stroke:cols[i],'stroke-width':4},s);p.forEach((v,j)=>el('circle',{cx:x0+30+j*(w-60),cy:sy(v),r:6,fill:cols[i]},s));if(labels[i])txt(s,x0+w-26,sy(p[1])+(i?18:-10),labels[i],{'text-anchor':'end',fill:cols[i],'font-weight':700,'font-size':13})});
     txt(s,x0+30,y0+h+20,'低',{'text-anchor':'middle'});txt(s,x0+w-30,y0+h+20,'高',{'text-anchor':'middle'})};
   panel(50,150,'溫度 主效果',[[(y(-1,-1)+y(-1,1))/2,(y(1,-1)+y(1,1))/2]],[css('--navy')],['']);
   panel(240,150,'時間 主效果',[[(y(-1,-1)+y(1,-1))/2,(y(-1,1)+y(1,1))/2]],[css('--navy')],['']);
   panel(440,260,'交互作用圖（橫軸：溫度）',[[y(-1,-1),y(1,-1)],[y(-1,1),y(1,1)]],[css('--blue'),css('--red')],['時間 短','時間 長']);
   txt(s,360,350,'硬度 HRC（模擬）',{'text-anchor':'middle','font-weight':700,fill:css('--ink')});
   const d1=y(1,-1)-y(-1,-1),d2=y(1,1)-y(-1,1);const cross=d1*d2<0||(y(-1,-1)-y(-1,1))*(y(1,-1)-y(1,1))<0;const st=Math.abs(I)<0.25?'平行：沒有交互作用':(cross?'交叉：強交互作用':'不平行：有交互作用');
   $('#iS').textContent=st;$('#ist').className='stat '+(Math.abs(I)<0.25?'':'bad');const c=[[-1,-1],[-1,1],[1,-1],[1,1]].sort((p,q)=>y(q[0],q[1])-y(p[0],p[1]))[0];$('#iBest').textContent=`溫度${c[0]>0?'高':'低'}＋時間${c[1]>0?'長':'短'}`}
  ['#iA','#iB','#iI'].forEach(k=>$(k).oninput=draw);draw();}},
{id:'square',tab:'四｜2² 手算',tag:'實驗③ · 全因子設計 2²',title:'正方形四個角，算出 A、B 與 AB 效果',
 say:'翼長 A × 迴紋針 B 的 2² 實驗，四個角是各組平均秒數。按「重新實驗」產生新數據，照右邊公式手算，再和系統答案對照。',
 key:'效果 ＝ 高水準平均 − 低水準平均。AB 效果 ＝ 對角線平均的差。',
 init(v,side){const W=720,H=400,s=svg(W,H);v.appendChild(s);let Y={};
  side.querySelector('.ctlbox').innerHTML=`<div class="btns"><button class="btn" id="sq">重新實驗</button><button class="btn ghost" id="sqs">顯示答案</button></div><div class="stats"><div class="stat"><b id="eA">?</b><span>A 翼長 效果</span></div><div class="stat"><b id="eB">?</b><span>B 迴紋針 效果</span></div><div class="stat"><b id="eAB">?</b><span>AB 交互作用</span></div><div class="stat"><b id="eM">?</b><span>總平均</span></div></div>`;
  let show=false;
  function gen(){const r=(a,b)=>2.8+0.35*a-0.25*b-0.12*a*b+rn()*0.05;Y={'--':r(-1,-1),'+-':r(1,-1),'-+':r(-1,1),'++':r(1,1)};show=false;draw()}
  function draw(){s.innerHTML='';const x0=130,y0=50,L=260;const P={'--':[x0,y0+L],'+-':[x0+L,y0+L],'-+':[x0,y0],'++':[x0+L,y0]};
   el('rect',{x:x0,y:y0,width:L,height:L,fill:css('--blueSoft'),stroke:css('--navy'),'stroke-width':3},s);
   el('line',{x1:x0,y1:y0+L,x2:x0+L,y2:y0,stroke:css('--red'),'stroke-width':1.5,'stroke-dasharray':'6 5'},s);el('line',{x1:x0,y1:y0,x2:x0+L,y2:y0+L,stroke:css('--blue'),'stroke-width':1.5,'stroke-dasharray':'6 5'},s);
   for(const k in P){const [cx,cy]=P[k];el('circle',{cx,cy,r:34,fill:css('--navy')},s);txt(s,cx,cy+7,f(Y[k],2),{'text-anchor':'middle',fill:'#fff','font-weight':900,'font-size':19,'font-family':css('--mono')});txt(s,cx,cy+(cy>y0+10?56:-44),`(${k[0]}1, ${k[1]}1)`,{'text-anchor':'middle','font-family':css('--mono')})}
   txt(s,x0+L/2,y0+L+84,'A 翼長：7 cm（−） → 10 cm（＋）',{'text-anchor':'middle','font-weight':700,fill:css('--ink')});const t=txt(s,x0-70,y0+L/2,'B 迴紋針：1（−） → 2（＋）',{'text-anchor':'middle','font-weight':700,fill:css('--ink')});t.setAttribute('transform',`rotate(-90 ${x0-70} ${y0+L/2})`);
   const fx=460;[['A 效果','= (右兩角平均) − (左兩角平均)'],['B 效果','= (上兩角平均) − (下兩角平均)'],['AB 效果','= (藍對角平均) − (紅對角平均)']].forEach(([a,b],i)=>{txt(s,fx,90+i*80,a,{'font-weight':900,'font-size':17,fill:css('--navy')});txt(s,fx,116+i*80,b,{'font-size':14})});
   const e=(k)=>k;const mA=(Y['+-']+Y['++'])/2-(Y['--']+Y['-+'])/2,mB=(Y['-+']+Y['++'])/2-(Y['--']+Y['+-'])/2,mAB=(Y['--']+Y['++'])/2-(Y['+-']+Y['-+'])/2,M=(Y['--']+Y['+-']+Y['-+']+Y['++'])/4;
   [['#eA',mA],['#eB',mB],['#eAB',mAB],['#eM',M]].forEach(([k,v])=>$(k).textContent=show?(v>0&&k!=='#eM'?'+':'')+f(v,2):'?')}
  $('#sq').onclick=gen;$('#sqs').onclick=()=>{show=true;draw()};gen();}},
{id:'cube',tab:'四｜全因子設計 2³',tag:'實驗④ · 全因子設計',title:'全因子設計 2³：8 組實驗，7 個效果，誰超過紅線？',
 say:'左邊是 2³ 立方體的 8 個角（各組平均秒數）。右邊是效果柏拉圖：超過紅線＝統計上重要。拉「重複次數」看紅線怎麼變。',
 key:'讀報表順序：柏拉圖 → P 值 → 交互作用 → 主效果 → 方程式 → 確認實驗。',
 init(v,side){const W=720,H=400,s=svg(W,H);v.appendChild(s);
  side.querySelector('.ctlbox').innerHTML=`<div class="ctl"><label for="cr">每組重複次數 <output id="ocr"></output></label><input type="range" id="cr" min="1" max="4" value="2"></div><div class="ctl"><label for="cn2">實驗雜訊 σ <output id="ocn2"></output></label><input type="range" id="cn2" min="0.02" max="0.3" step="0.02" value="0.1"></div><div class="btns"><button class="btn" id="cgo2">重新實驗</button></div><div class="stats"><div class="stat"><b id="cnr">—</b><span>總實驗次數</span></div><div class="stat"><b id="csig">—</b><span>超過紅線的效果</span></div></div>`;
  function draw(){s.innerHTML='';const r=+$('#cr').value,sg=+$('#cn2').value;$('#ocr').textContent=r;$('#ocn2').textContent=f(sg,2);
   const tr={A:0.35,B:0.25,C:-0.3,AB:-0.12,AC:0.02,BC:0.03,ABC:0.01};const runs=[];
   for(const c of [-1,1])for(const b of [-1,1])for(const a of [-1,1]){const reps=[];for(let k=0;k<r;k++)reps.push(2.8+(tr.A*a+tr.B*b+tr.C*c+tr.AB*a*b+tr.AC*a*c+tr.BC*b*c+tr.ABC*a*b*c)/2+rn()*sg);runs.push({a,b,c,m:mean(reps),reps})}
   const terms={A:x=>x.a,B:x=>x.b,C:x=>x.c,AB:x=>x.a*x.b,AC:x=>x.a*x.c,BC:x=>x.b*x.c,ABC:x=>x.a*x.b*x.c};const eff={};for(const k in terms)eff[k]=runs.reduce((t,x)=>t+terms[k](x)*x.m,0)/4;
   let sp=null;if(r>1){const ss=runs.reduce((t,x)=>t+x.reps.reduce((u,v)=>u+(v-x.m)**2,0),0);const df=8*(r-1);sp=Math.sqrt(ss/df);}
   const se=sp?2*sp/Math.sqrt(8*r):null,thr=se?tcrit(8*(r-1))*se:null;
   // cube
   const o=[80,300],dx=[190,0],dy=[0,-190],dz=[90,-70];const P=x=>[o[0]+(x.a+1)/2*dx[0]+(x.c+1)/2*dz[0],o[1]+(x.b+1)/2*dy[1]+(x.c+1)/2*dz[1]];
   const edges=[];runs.forEach((p,i)=>runs.forEach((q,j)=>{if(j>i&&Math.abs(p.a-q.a)+Math.abs(p.b-q.b)+Math.abs(p.c-q.c)===2)edges.push([p,q])}));
   edges.forEach(([p,q])=>{const [x1,y1]=P(p),[x2,y2]=P(q);el('line',{x1,y1,x2,y2,stroke:css('--ink2'),'stroke-width':1.5,opacity:.6},s)});
   runs.forEach(x=>{const [cx,cy]=P(x);el('circle',{cx,cy,r:24,fill:css('--navy')},s);txt(s,cx,cy+5,f(x.m,2),{'text-anchor':'middle',fill:'#fff','font-weight':700,'font-size':13,'font-family':css('--mono')})});
   txt(s,o[0]+95,o[1]+44,'A 翼長 →',{'text-anchor':'middle','font-weight':700,fill:css('--ink')});txt(s,o[0]-30,o[1]-100,'B 身長 ↑',{'text-anchor':'middle','font-weight':700,fill:css('--ink')});txt(s,o[0]+250,o[1]+10,'C 迴紋針 ↗',{'font-weight':700,fill:css('--ink')});
   // pareto
   const px0=430,pw=270,list=Object.entries(eff).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])),mx=0.45;let nsig=0;
   txt(s,px0,40,'效果柏拉圖（|效果|，秒）',{'font-weight':900,fill:css('--ink')});
   list.forEach(([k,e],i)=>{const y=60+i*40,sig=thr!==null&&Math.abs(e)>thr;if(sig)nsig++;el('rect',{x:px0+44,y,width:Math.min(pw,Math.abs(e)/mx*pw),height:26,fill:sig?css('--red'):css('--blue'),opacity:sig?1:.55},s);txt(s,px0+36,y+19,k,{'text-anchor':'end','font-weight':700,fill:css('--ink')});txt(s,px0+50+Math.min(pw,Math.abs(e)/mx*pw),y+19,f(e,2),{'font-family':css('--mono'),'font-size':12})});
   if(thr!==null){const x=px0+44+Math.min(pw,thr/mx*pw);el('line',{x1:x,y1:52,x2:x,y2:340,stroke:css('--red'),'stroke-width':2.5,'stroke-dasharray':'6 4'},s);txt(s,x,356,'紅線 '+f(thr,2),{'text-anchor':'middle',fill:css('--red'),'font-weight':700})}else txt(s,px0+44,356,'重複 1 次 → 無法估計誤差，畫不出紅線',{fill:css('--red'),'font-weight':700});
   $('#cnr').textContent=8*r+' 次';$('#csig').textContent=thr===null?'—':(list.filter(([k,e])=>Math.abs(e)>thr).map(x=>x[0]).join('、')||'無')}
  ['#cr','#cn2'].forEach(k=>$(k).oninput=draw);$('#cgo2').onclick=draw;draw();}},
{id:'random',tab:'二｜隨機化',tag:'單元二 · DOE 三原則',title:'不隨機，越丟越熟練也會變成「因子效果」',
 say:'16 次實驗，投放員越丟越熟練（每次多 0.02 秒）。翼長其實「沒有」效果。照標準順序（先做完 7 cm 再做 10 cm）vs 隨機順序，看估出來的翼長效果。',
 key:'隨機化能把時間造成的干擾打散，避免被誤判成因子效果。平台下載矩陣會自動幫你排好隨機順序。',
 init(v,side){const W=720,H=380,s=svg(W,H);v.appendChild(s);
  side.querySelector('.ctlbox').innerHTML=`<div class="ctl"><label for="rd">熟練度漂移（每次 +秒） <output id="ord"></output></label><input type="range" id="rd" min="0" max="0.05" step="0.005" value="0.02"></div><div class="btns"><button class="btn" id="rgo2">重新實驗</button></div><div class="stats"><div class="stat bad"><b id="rs1">—</b><span>標準順序：估出的翼長效果</span></div><div class="stat good"><b id="rs2">—</b><span>隨機順序：估出的翼長效果</span></div></div>`;
  function draw(){s.innerHTML='';const d=+$('#rd').value;$('#ord').textContent=f(d,3);
   const std=[...Array(16)].map((_,i)=>i<8?-1:1);const rnd=[...std].sort(()=>Math.random()-.5);
   const run=ord=>ord.map((a,i)=>({a,y:2.8+d*i+rn()*0.05}));const S1=run(std),S2=run(rnd);
   const eff=S=>mean(S.filter(x=>x.a>0).map(x=>x.y))-mean(S.filter(x=>x.a<0).map(x=>x.y));
   const plot=(S,y0,title)=>{const x0=60,w=620,h=120,sx=i=>x0+i/15*w,sy=v=>y0+h-(v-2.6)/0.9*h;txt(s,x0,y0-10,title,{'font-weight':900,fill:css('--ink')});el('line',{x1:x0,y1:y0+h,x2:x0+w,y2:y0+h,stroke:css('--ink2')},s);
     S.forEach((p,i)=>{el('rect',{x:sx(i)-13,y:sy(p.y),width:26,height:y0+h-sy(p.y),fill:p.a>0?css('--red'):css('--blue'),opacity:.8},s)});txt(s,x0+w,y0-10,'效果 '+f(eff(S),3)+' 秒',{'text-anchor':'end',fill:css('--red'),'font-weight':700})};
   plot(S1,40,'標準順序：先 8 次 7 cm（藍），再 8 次 10 cm（紅）');plot(S2,215,'隨機順序：照抽籤結果執行');
   txt(s,370,372,'執行順序 1 → 16（越後面越熟練）',{'text-anchor':'middle'});
   $('#rs1').textContent=f(eff(S1),3)+' 秒';$('#rs2').textContent=f(eff(S2),3)+' 秒'}
  $('#rd').oninput=draw;$('#rgo2').onclick=draw;draw();}},
{id:'sim',tab:'平台｜參數模擬器',tag:'實驗④ · 方程式與最佳化',title:'用模型預測：三顆旋鈕怎麼調，滯空最久？',
 say:'這是 2³ 實驗得到的方程式（代碼單位 −1～+1）。拉三個滑桿就像平台的「參數模擬器」，看預測秒數。再按「自動找最佳組合」。',
 key:'有了方程式就能預測，但模型只在做過實驗的範圍內可信；最佳條件一定要做確認實驗。',
 init(v,side){const W=720,H=360,s=svg(W,H);v.appendChild(s);
  side.querySelector('.ctlbox').innerHTML=`<div class="ctl"><label for="sa">A 翼長（7～10 cm） <output id="osa"></output></label><input type="range" id="sa" min="-1" max="1" step="0.1" value="0"></div><div class="ctl"><label for="sb">B 身長（7～10 cm） <output id="osb"></output></label><input type="range" id="sb" min="-1" max="1" step="0.1" value="0"></div><div class="ctl"><label for="sc">C 迴紋針（1～2 支） <output id="osc"></output></label><input type="range" id="sc" min="-1" max="1" step="1" value="-1"></div><div class="btns"><button class="btn" id="sopt">自動找最佳組合</button></div><div class="stats"><div class="stat"><b id="spred">—</b><span>預測滯空秒數</span></div><div class="stat"><b id="spi">—</b><span>95% 預測區間</span></div></div>`;
  const m=(a,b,c)=>2.8+0.175*a+0.125*b-0.15*c-0.06*a*b;
  function draw(){s.innerHTML='';const a=+$('#sa').value,b=+$('#sb').value,c=+$('#sc').value;$('#osa').textContent=f(8.5+1.5*a,1)+' cm';$('#osb').textContent=f(8.5+1.5*b,1)+' cm';$('#osc').textContent=c<0?'1 支':'2 支';
   const y=m(a,b,c);txt(s,20,36,'Y = 2.80 + 0.175·A + 0.125·B − 0.150·C − 0.060·A·B',{'font-family':css('--mono'),'font-size':16,'font-weight':600,fill:css('--navy')});
   const x0=60,w=600,lo=2.2,hi=3.4,sx=v=>x0+(v-lo)/(hi-lo)*w;el('rect',{x:x0,y:120,width:w,height:46,rx:23,fill:css('--blueSoft')},s);
   el('rect',{x:sx(y-0.12),y:120,width:sx(y+0.12)-sx(y-0.12),height:46,fill:css('--blue'),opacity:.35},s);el('rect',{x:x0,y:120,width:sx(y)-x0,height:46,rx:23,fill:css('--navy')},s);
   txt(s,sx(y),104,f(y,2)+' 秒',{'text-anchor':'middle','font-weight':900,'font-size':24,fill:css('--red')});axis(s,x0,190,x0+w,190,[2.2,2.4,2.6,2.8,3,3.2,3.4],sx,'預測滯空秒數');
   const bars=[['A 翼長',0.175],['B 身長',0.125],['C 迴紋針',-0.15],['A×B',-0.06]];txt(s,x0,236,'各項對 Y 的影響（係數）',{'font-weight':700,fill:css('--ink')});
   bars.forEach(([n,v],i)=>{const bx=x0+i*150;el('line',{x1:bx-10,y1:310,x2:bx+90,y2:310,stroke:css('--ink2')},s);el('rect',{x:bx,y:v>0?310-v*250:310,width:80,height:Math.abs(v)*250,fill:v>0?css('--blue'):css('--red')},s);txt(s,bx+40,v>0?330:310+Math.abs(v)*250+18,n,{'text-anchor':'middle','font-weight':700,fill:css('--ink')})});
   $('#spred').textContent=f(y,2);$('#spi').textContent=f(y-0.12,2)+' ～ '+f(y+0.12,2)}
  ['#sa','#sb','#sc'].forEach(k=>$(k).oninput=draw);$('#sopt').onclick=()=>{let best=[0,0,0,-9];for(let a=-1;a<=1.001;a+=0.1)for(let b=-1;b<=1.001;b+=0.1)for(const c of [-1,1]){const y=m(a,b,c);if(y>best[3])best=[a,b,c,y]}$('#sa').value=best[0].toFixed(1);$('#sb').value=best[1].toFixed(1);$('#sc').value=best[2];draw()};draw();}}
];


const tabs=$('#tabs'),stage=$('#stage');
function show(i){
  [...tabs.children].forEach((b,k)=>b.setAttribute('aria-selected',k===i));
  const L=LESSONS[i];
  stage.innerHTML=`<div class="viz" id="viz"></div><aside class="side"><span class="tag">${L.tag}</span><h2>${L.title}</h2><p class="say">${L.say}</p><div class="ctlbox" style="display:flex;flex-direction:column;gap:12px"></div><p class="key">${L.key}</p></aside>`;
  L.init($('#viz'),stage.querySelector('.side'));
  try{localStorage.setItem('doe_d3_tab',L.id)}catch(e){}
  if(history.replaceState)history.replaceState(null,'','#'+L.id);
}
LESSONS.forEach((L,i)=>{const b=document.createElement('button');b.role='tab';b.textContent=L.tab;b.onclick=()=>show(i);tabs.appendChild(b)});
let start=0;const h=location.hash.slice(1);let saved=null;try{saved=localStorage.getItem('doe_d3_tab')}catch(e){}
const pickId=h||saved;const k=LESSONS.findIndex(L=>L.id===pickId);if(k>=0)start=k;
show(start);
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const cur=[...tabs.children].findIndex(b=>b.getAttribute('aria-selected')==='true');if(e.key==='ArrowRight'&&cur<LESSONS.length-1)show(cur+1);if(e.key==='ArrowLeft'&&cur>0)show(cur-1)});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>show([...tabs.children].findIndex(b=>b.getAttribute('aria-selected')==='true')));
})();
</script>
</html>
